<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Up Game</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #0f0f1a;
      color: #fff;
      font-family: sans-serif;
    }
    .start-btn {
      padding: 12px 24px;
      font-size: 16px;
      background: #00f0ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Ultra Up ゲーム</h1>
  <p>下のボタンを押すとゲームが起動します。</p>
  <button class="start-btn" onclick="startUltraUp()">ゲームをスタート</button>

  <!-- ゲームのJavaScriptファイルを読み込み -->
  <script src="game.js"></script>
</body>
</html>
